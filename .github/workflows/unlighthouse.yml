name: Unlighthouse

on:
  push:
    branches: [main]
    paths: &paths
      - "src/**"
      - "public/**"
      - "astro.config.mjs"
      - "uno.config.ts"
      - "void.config.ts"
      - "env.ts"
      - "tsconfig.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "unlighthouse.config.ts"
      - ".github/workflows/unlighthouse.yml"
  pull_request:
    branches: [main]
    paths: *paths
  workflow_call:
    inputs:
      site:
        description: Deployed URL to scan instead of a local production build
        required: false
        type: string
  workflow_dispatch:
    inputs:
      site:
        description: Deployed URL to scan instead of a local production build
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-unlighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Lighthouse budgets
    # Release calls this workflow after the release PR merges, so the PR itself skips it.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          cache: true
      - name: Allow the Chrome sandbox on Ubuntu 24.04
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build and serve the production build
        if: ${{ !inputs.site }}
        env:
          # The default site is on workers.dev, which robots.txt and a noindex tag block, so the
          # scan would find no routes and score SEO 69. Scan the build as its own origin.
          VITE_APP_SITE: http://localhost:4321
        run: |
          vp run build
          nohup vp exec astro preview --ignore-lock > preview.log 2>&1 &
          for _ in $(seq 1 30); do
            curl --silent --fail --output /dev/null http://localhost:4321/ && exit 0
            sleep 1
          done
          cat preview.log
          exit 1
      - name: Run Unlighthouse budgets
        env:
          SITE: ${{ inputs.site }}
        run: vp run unlighthouse:ci ${SITE:+--site "$SITE"}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: unlighthouse-report
          path: .unlighthouse/
          retention-days: 30

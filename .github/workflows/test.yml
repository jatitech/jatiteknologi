name: Test

on:
  push:
    branches: [main]
    paths: &paths
      - "src/**"
      - "public/_headers"
      - "vite.config.ts"
      - "astro.config.mjs"
      - "env.ts"
      - "tsconfig.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/test.yml"
  pull_request:
    branches: [main]
    paths: *paths
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    name: Unit, browser and type tests
    # Release calls this workflow after the release PR merges, so the PR itself skips it.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version-file: pnpm-workspace.yaml
          cache: true
      - name: Generate Astro types
        run: vp exec astro sync
      - name: Install Chromium for browser mode
        run: vp exec playwright install --with-deps chromium
      - name: Run Vitest
        run: vp run test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: vitest-failure-screenshots
          path: .vitest/attachments/
          retention-days: 30
